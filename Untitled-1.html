<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Trancomm Logo SVG</title>

</style>
</head>
<body>

<div class="logo-container">
  <!-- FULL TRANCOMM LOGO SVG -->
  <svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
    
    <!-- Curved Orbital Line -->
    <path d="M 90 25 C 10 25, 20 120, 90 135 C 140 145, 180 130, 210 110" fill="none" stroke="#164a69" stroke-width="4" stroke-linecap="round" />
    
    <!-- Network Node / Dot -->
    <circle cx="53" cy="98" r="8" fill="#164a69" />
    
    <!-- 'TRAN' (Dark Blue) -->
    <text x="100" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#164a69" letter-spacing="1">TRAN</text>
    
    <!-- 'COMM' (Dark Grey) -->
    <text x="325" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#63666a" letter-spacing="1">COMM</text>
    
    <!-- 'communications' (Light Grey, aligned to the right of COMM) -->
    <text x="560" y="128" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="24" fill="#a0a3a6" letter-spacing="0.5" text-anchor="end">communications</text>
    
  </svg>
</div>

</body>
</html>
