<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trancomm - Proficiency</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .proficiency-section {
            width: 100%;
            max-width: 1300px;
            padding: 60px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Section Header */
        .header-tag {
            font-family: Georgia, serif;
            font-style: italic;
            font-size: 2.2rem;
            color: #1a8c9e;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .header-subtext {
            font-size: 1.05rem;
            color: #b0c4de;
            max-width: 750px;
            margin: 0 auto 50px auto;
            line-height: 1.6;
        }

        .header-subtext strong {
            color: #ffffff;
        }

        /* Cards Grid Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Individual Card Style */
        .card {
            position: relative;
            height: 420px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(26, 140, 158, 0.25);
            border-color: rgba(26, 140, 158, 0.5);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
            filter: brightness(0.7);
        }

        .card:hover img {
            transform: scale(1.08);
            filter: brightness(0.5);
        }

        /* Dark Gradient Overlay */
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(11, 15, 25, 0.95) 10%, rgba(11, 15, 25, 0.2) 70%);
            pointer-events: none;
        }

        /* Card Title */
        .card-title {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            z-index: 2;
            font-family: Georgia, serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.5px;
            padding: 0 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .header-tag {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="proficiency-section">
        <div class="header-tag">Proficiency</div>
        <div class="header-subtext">
            We exceed <strong>above &amp; beyond</strong> to show you why we're paramount in the region for <strong>your business needs</strong>.
        </div>

        <div class="cards-grid">
            <!-- Card 1: Telecommunications -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80" alt="Telecommunications">
                <div class="card-title">Telecommunications</div>
            </div>

            <!-- Card 2: Information Technology (IT) -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=600&q=80" alt="Information Technology">
                <div class="card-title">Information Technology (IT)</div>
            </div>

            <!-- Card 3: Bespoke Solutions -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=600&q=80" alt="Bespoke Solutions">
                <div class="card-title">Beskope Solutions</div>
            </div>

            <!-- Card 4: AI & Data Analytics -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80" alt="AI & Data Analytics">
                <div class="card-title">AI &amp; Data Analytics</div>
            </div>
        </div>
    </div>

</body>
</html>
