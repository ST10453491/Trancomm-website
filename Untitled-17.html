<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry Segments | Trancomm</title>
    <style>
        :root {
            --bg-color: #050505;
            --cyan-accent: #1a8c9e;
            --text-main: #f4f4f2;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        .industry-section {
            position: relative;
            width: 100%;
            padding: 100px 20px;
            background: radial-gradient(circle at center, #111a1f 0%, var(--bg-color) 70%);
            overflow: hidden;
        }

        /* Subtle grid mesh background effect */
        .industry-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle, rgba(26, 140, 158, 0.15) 1px, transparent 1px),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px, 100px 100px, 100px 100px;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .section-eyebrow {
            color: var(--cyan-accent);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .section-title {
            font-family: Georgia, serif;
            font-size: 3rem;
            font-weight: 400;
            margin: 0 0 60px 0;
            color: #ffffff;
        }

        /* Grid Layout */
        .segments-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .segment-card {
            background: rgba(15, 15, 15, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .segment-card:hover {
            transform: translateY(-8px);
            border-color: var(--cyan-accent);
            background: rgba(26, 140, 158, 0.08);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(26, 140, 158, 0.2);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .segment-card:hover .icon-box {
            transform: scale(1.1);
        }

        .icon-box svg {
            width: 45px;
            height: 45px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .segment-title {
            font-family: Georgia, serif;
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-main);
            margin: 0;
        }

        /* Responsive Layout */
        @media (max-width: 1024px) {
            .segments-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .segments-grid {
                grid-template-columns: 1fr;
            }
            .section-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <section class="industry-section">
        <div class="container">
            <div class="section-eyebrow">Sectors We Empower</div>
            <h2 class="section-title">Industry Segments</h2>

            <div class="segments-grid">
                
                <!-- 1. Oil & Gas -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/><path d="M4 19l4-4M16 9l4-4"/></svg>
                    </div>
                    <h3 class="segment-title">Oil & Gas</h3>
                </div>

                <!-- 2. Marine -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
                    </div>
                    <h3 class="segment-title">Marine</h3>
                </div>

                <!-- 3. Bank Network -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                    </div>
                    <h3 class="segment-title">Bank Network</h3>
                </div>

                <!-- 4. Government -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/></svg>
                    </div>
                    <h3 class="segment-title">Government</h3>
                </div>

                <!-- 5. Security & Defense -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <h3 class="segment-title">Security & Defense</h3>
                </div>

                <!-- 6. Broadcast & Media -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 19.1c3.9-3.9 3.9-10.3 0-14.2M2 12h20M12 2v20"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                    <h3 class="segment-title">Broadcast & Media</h3>
                </div>

                <!-- 7. Mining & Construction -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M14.5 17.5L3 6l3-3 11.5 11.5M13 19l2-2M16 16l2-2M19 13l2-2"/></svg>
                    </div>
                    <h3 class="segment-title">Mining & Construction</h3>
                </div>

                <!-- 8. Telecommunications -->
                <div class="segment-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><path d="M12 18h.01M8 6h8M8 10h8"/></svg>
                    </div>
                    <h3 class="segment-title">Telecommunications</h3>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
