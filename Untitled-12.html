<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trancomm - Strategic Partners</title>
    <style>
        :root {
            --bg-color: #050505;
            --cyan-accent: #1a8c9e;
            --slider-bg: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        .partners-section {
            padding: 80px 20px;
            text-align: center;
        }

        .section-eyebrow {
            color: var(--cyan-accent);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .section-title {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin: 0 0 50px 0;
        }

        /* --- Carousel Container --- */
        .logo-slider {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--slider-bg);
            border-radius: 20px;
            overflow: hidden;
            white-space: nowrap;
            padding: 30px 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        /* Fade Out Edges (Matched to the light background) */
        .logo-slider::before,
        .logo-slider::after {
            content: "";
            position: absolute;
            top: 0;
            width: 150px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .logo-slider::before {
            left: 0;
            background: linear-gradient(to right, var(--slider-bg) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .logo-slider::after {
            right: 0;
            background: linear-gradient(to left, var(--slider-bg) 0%, rgba(0, 0, 0, 0) 100%);
        }

        /* --- Moving Track --- */
        .logo-track {
            display: inline-flex;
            align-items: center;
            animation: scroll 35s linear infinite;
        }

        .logo-track:hover {
            animation-play-state: paused;
        }

        /* --- Individual Logo Slides --- */
        .slide {
            width: 220px; 
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            flex-shrink: 0;
        }

        .slide img {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
            /* Filters removed to show full, real colors */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* Slight pop-out effect on hover */
        .slide img:hover {
            transform: scale(1.15);
        }

        /* --- Infinite Scroll Animation --- */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-slider::before,
            .logo-slider::after {
                width: 60px;
            }
            .slide {
                width: 160px;
                padding: 0 15px;
            }
            .slide img {
                max-height: 60px;
            }
        }
    </style>
</head>
<body>

    <section class="partners-section">
        
        <div class="section-eyebrow">Alliances & Certifications</div>
        <h2 class="section-title">Our Strategic Partners</h2>

        <div class="logo-slider">
            <div class="logo-track">

                <div class="slide"><img src="molex-logo%20c.png" alt="Molex"></div>
                <div class="slide"><img src="mustek%20logo.jpg" alt="Mustek Limited"></div>
                <div class="slide"><img src="orbus%20logo.jpg" alt="Orbus Software"></div>
                <div class="slide"><img src="tarsus%20logo.jpg" alt="Tarsus Technology Group"></div>
                <div class="slide"><img src="obasa_logo.jpeg" alt="OBASA"></div>
                <div class="slide"><img src="Dell-logo.jpg" alt="Dell"></div>

                <div class="slide"><img src="orbus%20logo.jpg" alt="Orbus Software"></div>
                <div class="slide"><img src="tarsus%20logo.jpg" alt="Tarsus Technology Group"></div>

</html>
